name: ③ 증시 브리핑

on:
  schedule:
    - cron: "50 22 * * 0-4"   # 평일 07:50 KST → 장전 브리핑
    - cron: "50 1 * * 1-5"    # 평일 10:50 KST → 장중 브리핑
    - cron: "50 6 * * 1-5"    # 평일 15:50 KST → 장마감 브리핑
  workflow_dispatch:
    inputs:
      force:
        description: "휴장일·중복 체크 무시하고 강제 실행"
        type: boolean
        default: true
      slot:
        description: "브리핑 종류"
        type: choice
        options: [auto, pre, mid, close]
        default: auto
permissions:
  contents: write

concurrency:
  group: state-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m bot.market_brief --slot ${{ inputs.slot || 'auto' }} ${{ inputs.force && '--force' || '' }}
      - name: 발송 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/market.json
          git diff --cached --quiet && exit 0
          git commit -m "state: market $(date +'%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
