name: ⑪ 미국시장 마감·국내 관련 테마

on:
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 보냈어도 다시 발송 (휴장일에도 실행)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m bot.us_market ${{ inputs.force && '--force' || '' }}
      - name: 발송 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state/us_market.json ] || exit 0
          git add state/us_market.json
          git diff --cached --quiet && exit 0
          git commit -m "state: us_market $(date +'%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
