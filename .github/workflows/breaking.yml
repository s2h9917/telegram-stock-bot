name: ⑧ 이벤트 속보

on:
  workflow_dispatch:
    inputs:
      force:
        description: "시간대 무시하고 오늘 첫 이벤트로 테스트 (실제 발송됨)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 필요한 것만 빠르게 설치
        run: pip install -q requests feedparser
      - name: 실행
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.breaking ${{ inputs.force && '--force' || '--watch' }}
      - name: 발송 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state/breaking.json ] || exit 0
          git add state/breaking.json
          git diff --cached --quiet && exit 0
          git commit -m "state: breaking $(date +'%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
