name: ⑤ 종목 뉴스

on:
  workflow_dispatch:
    inputs:
      force:
        description: "시간대·휴장일 체크 무시하고 강제 실행"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: state-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m bot.stock_news ${{ inputs.force && '--force' || '' }}
      - name: 발송 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state/stock_news.json state/listed.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && exit 0
          git commit -m "state: stock_news $(date +'%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
