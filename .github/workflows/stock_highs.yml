name: ⑨ 신고가·신저가
on:
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 보냈어도 다시 발송 (휴장일에도 실행)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: state-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 필요한 것만 빠르게 설치
        run: pip install -q requests
      - name: 실행
        env:
          TZ: Asia/Seoul
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.stock_highs ${{ inputs.force && '--force' || '' }}
      - name: 발송 기록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state/stock_highs.json ] || exit 0
          git add state/stock_highs.json
          git diff --cached --quiet && exit 0
          git commit -m "state: stock_highs $(date +'%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
